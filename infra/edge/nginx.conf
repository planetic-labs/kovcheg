worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  access_log off;
  error_log /dev/stderr warn;

  server {
    listen 8080;
    server_name _;

    location /api/ {
      proxy_pass http://api:3001/;
      proxy_http_version 1.1;
    }

    location /auth/ {
      proxy_pass http://auth:3002/;
      proxy_http_version 1.1;
    }

    location / {
      proxy_pass http://web:3000;
      proxy_http_version 1.1;
    }
  }
}
