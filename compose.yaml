name: kovcheg-local

services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    expose:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready --username postgres --dbname postgres']
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - local
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8.2.1-bookworm
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    expose:
      - '6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - local

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      HOST: 0.0.0.0
      NODE_ENV: production
      PORT: '3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - '3001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    init: true
    networks:
      - local
    ports:
      - '127.0.0.1:3001:3001'
    stop_grace_period: 10s

  auth:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
    environment:
      HOST: 0.0.0.0
      NODE_ENV: production
      PORT: '3002'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - '3002'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3002/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    init: true
    networks:
      - local
    ports:
      - '127.0.0.1:3002:3002'
    stop_grace_period: 10s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      HOST: 0.0.0.0
      NODE_ENV: production
      PORT: '3003'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - '3003'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3003/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    init: true
    networks:
      - local
    stop_grace_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_ENV: production
      PORT: '3000'
    depends_on:
      api:
        condition: service_healthy
      auth:
        condition: service_healthy
      worker:
        condition: service_healthy
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    init: true
    networks:
      - local
    ports:
      - '127.0.0.1:3000:3000'
    stop_grace_period: 10s

networks:
  local:
    driver: bridge
    internal: true

volumes:
  postgres-data:
