name: kovcheg-local

x-api-common: &api-common
  build:
    context: .
    dockerfile: apps/api/Dockerfile
    args:
      BUILD_COMMIT_SHA: ${BUILD_COMMIT_SHA:-}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  expose:
    - '3001'
  healthcheck:
    test:
      [
        'CMD',
        'node',
        '-e',
        "fetch('http://127.0.0.1:3001/health/ready').then(async r=>{const b=await r.json();if(!r.ok||b.status!=='ok')process.exit(1)}).catch(()=>process.exit(1))",
      ]
    interval: 5s
    timeout: 3s
    retries: 20
  init: true
  networks:
    - local
  secrets:
    - postgres_runtime_password
    - realtime_relay_token
  stop_grace_period: 10s

x-api-environment: &api-environment
  BUILD_IMAGE_DIGEST: ${BUILD_IMAGE_DIGEST:-}
  HOST: 0.0.0.0
  LOG_LEVEL: info
  NODE_ENV: production
  PGDATABASE: kovcheg
  PGHOST: postgres
  PGPASSWORD_FILE: /run/secrets/postgres_runtime_password
  PGUSER: kovcheg_app
  PORT: '3001'
  REALTIME_RELAY_TOKEN_FILE: /run/secrets/realtime_relay_token
  REDIS_URL: redis://redis:6379

services:
  postgres:
    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    command: ['postgres', '-c', 'password_encryption=scram-sha-256']
    environment:
      POSTGRES_DB: kovcheg
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256 --auth-local=scram-sha-256'
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
      POSTGRES_USER: postgres
    expose:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready --host 127.0.0.1 --username postgres --dbname kovcheg']
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - local
    secrets:
      - postgres_audit_password
      - postgres_auth_password
      - postgres_migration_password
      - postgres_runtime_password
      - postgres_superuser_password
    volumes:
      - ./infra/postgres:/workspace/infra/postgres:ro
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data

  migrate:
    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    command: ['/workspace/infra/postgres/migrate.sh']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGDATABASE: kovcheg
      PGHOST: postgres
      PGPASSWORD_FILE: /run/secrets/postgres_migration_password
      PGUSER: kovcheg_migrator
    networks:
      - local
    profiles:
      - data
    secrets:
      - postgres_migration_password
    volumes:
      - ./infra/postgres:/workspace/infra/postgres:ro

  database-test:
    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    command: ['/workspace/infra/postgres/tests/verify.sh']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGDATABASE: kovcheg
      PGHOST: postgres
    networks:
      - local
    profiles:
      - data
    secrets:
      - postgres_audit_password
      - postgres_auth_password
      - postgres_migration_password
      - postgres_runtime_password
      - postgres_superuser_password
    volumes:
      - ./infra/postgres:/workspace/infra/postgres:ro

  message-flow-test:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: message-flow-test
    command: ['node', 'dist/message-flow/message-flow.integration-check.js']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LOG_LEVEL: error
      NODE_ENV: test
      PGDATABASE: kovcheg
      PGHOST: postgres
      PGPASSWORD_FILE: /run/secrets/postgres_runtime_password
      PGUSER: kovcheg_app
    networks:
      - local
    profiles:
      - data
    secrets:
      - postgres_runtime_password

  auth-integration-test:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
      target: auth-integration-test
    command: ['node', 'dist/a2/auth.integration-check.js']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AUTH_REDIS_URL: redis://redis:6379
      LOG_LEVEL: error
      NODE_ENV: test
      PGDATABASE: kovcheg
      PGHOST: postgres
      PGPASSWORD_FILE: /run/secrets/postgres_auth_password
      PGUSER: kovcheg_auth_app
    networks:
      - local
    profiles:
      - data
    secrets:
      - postgres_auth_password

  redis:
    image: redis:8.2.1-bookworm@sha256:5fa2edb1e408fa8235e6db8fab01d1afaaae96c9403ba67b70feceb8661e8621
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    expose:
      - '6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - local

  api-1:
    <<: *api-common
    environment:
      <<: *api-environment
      INSTANCE_ID: api-1

  api-2:
    <<: *api-common
    environment:
      <<: *api-environment
      INSTANCE_ID: api-2

  auth:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
      args:
        BUILD_COMMIT_SHA: ${BUILD_COMMIT_SHA:-}
    environment:
      BUILD_IMAGE_DIGEST: ${BUILD_IMAGE_DIGEST:-}
      HOST: 0.0.0.0
      LOG_LEVEL: info
      NODE_ENV: production
      PGDATABASE: kovcheg
      PGHOST: postgres
      PGPASSWORD_FILE: /run/secrets/postgres_auth_password
      PGUSER: kovcheg_auth_app
      PORT: '3002'
      AUTH_REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - '3002'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3002/health/ready').then(async r=>{const b=await r.json();if(!r.ok||b.status!=='ok')process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    init: true
    networks:
      - local
    secrets:
      - postgres_auth_password
    stop_grace_period: 10s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      args:
        BUILD_COMMIT_SHA: ${BUILD_COMMIT_SHA:-}
    environment:
      BUILD_IMAGE_DIGEST: ${BUILD_IMAGE_DIGEST:-}
      HOST: 0.0.0.0
      INSTANCE_ID: worker-1
      LOG_LEVEL: info
      NODE_ENV: production
      PGDATABASE: kovcheg
      PGHOST: postgres
      PGPASSWORD_FILE: /run/secrets/postgres_runtime_password
      PGUSER: kovcheg_app
      PORT: '3003'
      REALTIME_RELAY_TOKEN_FILE: /run/secrets/realtime_relay_token
      REALTIME_RELAY_URL: http://edge:8080/api/internal/realtime/events
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - '3003'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3003/health/ready').then(async r=>{const b=await r.json();if(!r.ok||b.status!=='ok')process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    init: true
    networks:
      - local
    secrets:
      - postgres_runtime_password
      - realtime_relay_token
    stop_grace_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        BUILD_COMMIT_SHA: ${BUILD_COMMIT_SHA:-}
    environment:
      BUILD_IMAGE_DIGEST: ${BUILD_IMAGE_DIGEST:-}
      HOST: 0.0.0.0
      LOG_LEVEL: info
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_ENV: production
      PORT: '3000'
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
      auth:
        condition: service_healthy
      worker:
        condition: service_healthy
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(async r=>{const b=await r.json();if(!r.ok||b.status!=='ok')process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    init: true
    networks:
      - local
    stop_grace_period: 10s

  edge:
    image: traefik:v3.7.7@sha256:1cb3845d7a05e1473c9086351426597e911db49db382b6e4769f9b0744962ac8
    command: ['--configFile=/etc/traefik/traefik.yaml']
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
      auth:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 5s
      timeout: 3s
      retries: 20
    init: true
    networks:
      - local
      - host-loopback
    ports:
      - '127.0.0.1:3000:8080'
    read_only: true
    stop_grace_period: 10s
    tmpfs:
      - /tmp
    volumes:
      - ./infra/edge/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./infra/edge/routes.yaml:/etc/traefik/routes.yaml:ro

networks:
  host-loopback:
    driver: bridge
  local:
    driver: bridge
    internal: true

secrets:
  postgres_audit_password:
    file: ${KOVCHEG_POSTGRES_AUDIT_PASSWORD_FILE:?local audit password file is required}
  postgres_auth_password:
    file: ${KOVCHEG_POSTGRES_AUTH_PASSWORD_FILE:?local auth password file is required}
  postgres_migration_password:
    file: ${KOVCHEG_POSTGRES_MIGRATION_PASSWORD_FILE:?local migration password file is required}
  postgres_runtime_password:
    file: ${KOVCHEG_POSTGRES_RUNTIME_PASSWORD_FILE:?local runtime password file is required}
  postgres_superuser_password:
    file: ${KOVCHEG_POSTGRES_SUPERUSER_PASSWORD_FILE:?local superuser password file is required}
  realtime_relay_token:
    file: ${KOVCHEG_REALTIME_RELAY_TOKEN_FILE:?local realtime relay token file is required}

volumes:
  postgres-data:
