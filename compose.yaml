name: kovcheg-local

services:
  postgres:
    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    expose:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready --username postgres --dbname postgres']
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - local
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8.2.1-bookworm@sha256:5fa2edb1e408fa8235e6db8fab01d1afaaae96c9403ba67b70feceb8661e8621
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    expose:
      - '6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - local

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        BUILD_COMMIT_SHA: ${BUILD_COMMIT_SHA:-}
    environment:
      BUILD_IMAGE_DIGEST: ${BUILD_IMAGE_DIGEST:-}
      HOST: 0.0.0.0
      LOG_LEVEL: info
      NODE_ENV: production
      PORT: '3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - '3001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health/ready').then(async r=>{const b=await r.json();if(!r.ok||b.status!=='ok')process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    init: true
    networks:
      - local
    stop_grace_period: 10s

  auth:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
      args:
        BUILD_COMMIT_SHA: ${BUILD_COMMIT_SHA:-}
    environment:
      BUILD_IMAGE_DIGEST: ${BUILD_IMAGE_DIGEST:-}
      HOST: 0.0.0.0
      LOG_LEVEL: info
      NODE_ENV: production
      PORT: '3002'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - '3002'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3002/health/ready').then(async r=>{const b=await r.json();if(!r.ok||b.status!=='ok')process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    init: true
    networks:
      - local
    stop_grace_period: 10s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      args:
        BUILD_COMMIT_SHA: ${BUILD_COMMIT_SHA:-}
    environment:
      BUILD_IMAGE_DIGEST: ${BUILD_IMAGE_DIGEST:-}
      HOST: 0.0.0.0
      LOG_LEVEL: info
      NODE_ENV: production
      PORT: '3003'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - '3003'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3003/health/ready').then(async r=>{const b=await r.json();if(!r.ok||b.status!=='ok')process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    init: true
    networks:
      - local
    stop_grace_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        BUILD_COMMIT_SHA: ${BUILD_COMMIT_SHA:-}
    environment:
      BUILD_IMAGE_DIGEST: ${BUILD_IMAGE_DIGEST:-}
      HOST: 0.0.0.0
      LOG_LEVEL: info
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_ENV: production
      PORT: '3000'
    depends_on:
      api:
        condition: service_healthy
      auth:
        condition: service_healthy
      worker:
        condition: service_healthy
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(async r=>{const b=await r.json();if(!r.ok||b.status!=='ok')process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    init: true
    networks:
      - local
    stop_grace_period: 10s

  edge:
    image: nginx:1.29.1-alpine@sha256:42a516af16b852e33b7682d5ef8acbd5d13fe08fecadc7ed98605ba5e3b26ab8
    depends_on:
      api:
        condition: service_healthy
      auth:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --quiet --output-document=- http://127.0.0.1:8080/health/ready >/dev/null',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    init: true
    networks:
      - local
      - host-loopback
    ports:
      - '127.0.0.1:3000:8080'
    read_only: true
    stop_grace_period: 10s
    tmpfs:
      - /var/cache/nginx
      - /var/run
    volumes:
      - ./infra/edge/nginx.conf:/etc/nginx/nginx.conf:ro

networks:
  host-loopback:
    driver: bridge
  local:
    driver: bridge
    internal: true

volumes:
  postgres-data:
